<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
  <title>Cats</title>
  <style>
    body { background: #F1EFD9; color: #5A3112; }
    h1, h2 { color: #A9642A; margin-top: 20px; }
    .box { background: #C5D9C1; padding: 15px; border-radius: 8px; border-left: 6px solid #BF7E31; }
    img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; border: 3px solid #BF7E31; }
  </style>
</head>
<body>
<div class="container">

  <h1>Породы кошек</h1>
  <div class="box"><p class="mb-0">Мир кошек очень разнообразен.</p></div>

  <h2>Популярные породы</h2>
  <ul>
    <li>Британская</li>
    <li>Мейн-кун</li>
    <li>Сиамская</li>
  </ul>

  <h2>Рейтинг по размеру</h2>
  <ol>
    <li>Мейн-кун</li>
    <li>Британская</li>
    <li>Сиамская</li>
  </ol>

  <h2>Галерея</h2>
  <div class="row">
    <div class="col-12 col-sm-6 col-md-4 col-xl-2 mb-3"><img src="images/cat1.jpg" alt="Кошка 1"></div>
    <div class="col-12 col-sm-6 col-md-4 col-xl-2 mb-3"><img src="images/cat2.jpg" alt="Кошка 2"></div>
    <div class="col-12 col-sm-6 col-md-4 col-xl-2 mb-3"><img src="images/cat3.jpg" alt="Кошка 3"></div>
    <div class="col-12 col-sm-6 col-md-4 col-xl-2 mb-3"><img src="images/cat4.jpg" alt="Кошка 4"></div>
    <div class="col-12 col-sm-6 col-md-4 col-xl-2 mb-3"><img src="images/cat5.jpg" alt="Кошка 5"></div>
    <div class="col-12 col-sm-6 col-md-4 col-xl-2 mb-3"><img src="images/cat6.jpg" alt="Кошка 6"></div>
  </div>

</div>
</body>
</html>
